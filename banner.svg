<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Honeypot Bot: bane automaticamente quem cair na armadilha" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12132a"/>
      <stop offset="1" stop-color="#3b3fa8"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#E8870E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="hexmask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
    <pattern id="hex" width="34.64" height="60" patternUnits="userSpaceOnUse">
      <path d="M17.32 0 L34.64 10 M17.32 0 L0 10 M0 10 V30 M34.64 10 V30 M0 30 L17.32 40 L34.64 30 M17.32 40 V60"
            fill="none" stroke="#FFC94D" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#hex)" mask="url(#hexmask)"/>

  <!-- Pote de mel com sinal de proibido -->
  <g transform="translate(95,62)">
    <ellipse cx="60" cy="196" rx="62" ry="10" fill="#000" fill-opacity="0.25"/>
    <path d="M30 70 C0 80 -5 150 20 180 C35 198 85 198 100 180 C125 150 120 80 90 70 Z" fill="url(#honey)"/>
    <rect x="25" y="52" width="70" height="22" rx="8" fill="#FFD978"/>
    <path d="M88 74 v28 a7 7 0 0 0 14 0 v-28 z" fill="#FFC94D"/>
    <rect x="28" y="108" width="64" height="46" rx="8" fill="#fff" fill-opacity="0.95"/>
    <circle cx="60" cy="131" r="15" fill="none" stroke="#E5484D" stroke-width="5"/>
    <line x1="49" y1="142" x2="71" y2="120" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Textos -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="300" y="150" font-size="76" font-weight="800" fill="#ffffff">Honeypot Bot</text>
    <text x="302" y="198" font-size="27" fill="#C9CCFF">Bane automaticamente quem cair na armadilha.</text>

    <g font-size="20" font-weight="600" text-anchor="middle">
      <rect x="302" y="228" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.14"/>
      <text x="357" y="254" fill="#ffffff">Python</text>
      <rect x="428" y="228" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.14"/>
      <text x="503" y="254" fill="#ffffff">discord.py</text>
      <rect x="594" y="228" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.14"/>
      <text x="664" y="254" fill="#ffffff">Anti-spam</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
